name: Dockflow checks

on:
  push:
    branches: [main]
    paths: ['dockflow/**', '.github/workflows/dockflow.yml']
  pull_request:
    paths: ['dockflow/**', '.github/workflows/dockflow.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dockflow
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
